version:          '3'

services:
  v-viewer:
    image: node:18-alpine3.15
    command:      ash -c "yarn install && yarn dist"
    #command: tail -F anything
    environment:
      - IS_ENABLED_DOGS6=true
      - V_VIEWER_DOGS6_PARTNER=stanleybet
      - V_VIEWER_DOGS6_INDEX_TITLE=PGVirtual V-Viewer Dogs6
      - V_VIEWER_DOGS6_API_ENDPOINT="https://api.stanleybet-staging.pegma.group/api"
      #- V_VIEWER_DOGS6_API_ENDPOINT=(function(){return document.location.protocol + "//" + document.location.hostname + ":9900/dogs6"}())
      - V_VIEWER_DOGS6_JS_ENTRYPOINT=v-viewer-dogs6.min.js
      - V_VIEWER_DOGS6_VARS=
        var v_param__show_partner_logo = 1, 
        v_param__full = 1,
        v_param__audio = 1,
        v_param__gui_layout_version = "v2",
        v_param__operator = "stanleybet",
        v_param__hide_channel = 0;

      - IS_ENABLED_HORSES6=true
      - V_VIEWER_HORSES6_PARTNER=stanleybet
      - V_VIEWER_HORSES6_INDEX_TITLE=PGVirtual V-Viewer Horses6
      - V_VIEWER_HORSES6_API_ENDPOINT="https://api.stanleybet-staging.pegma.group/api"
      #- V_VIEWER_HORSES6_API_ENDPOINT=(function(){return document.location.protocol + "//" + document.location.hostname + ":9900/horses6"}())
      - V_VIEWER_HORSES6_JS_ENTRYPOINT=v-viewer-horses6.min.js
      - V_VIEWER_HORSES6_VARS=
        var v_param__show_partner_logo = 1, 
        v_param__full = 1,
        v_param__audio = 1,
        v_param__gui_layout_version = "v2",
        v_param__operator = "stanleybet",
        v_param__hide_channel = 0;
      
      - IS_ENABLED_DOGS8=true
      - V_VIEWER_DOGS8_PARTNER=stanleybet
      - V_VIEWER_DOGS8_INDEX_TITLE=PGVirtual V-Viewer Dogs8
      - V_VIEWER_DOGS8_API_ENDPOINT="https://api.stanleybet-staging.pegma.group/api"
      #- V_VIEWER_DOGS8_API_ENDPOINT=(function(){return document.location.protocol + "//" + document.location.hostname + ":9900/dogs8"}())
      - V_VIEWER_DOGS8_JS_ENTRYPOINT=v-viewer-dogs8.min.js
      - V_VIEWER_DOGS8_VARS=
        var v_param__show_partner_logo = 1, 
        v_param__full = 1,
        v_param__audio = 1,
        v_param__gui_layout_version = "v2",
        v_param__operator = "stanleybet",
        v_param__hide_channel = 0;

      - IS_ENABLED_TROTTING8=true
      - V_VIEWER_TROTTING8_PARTNER=stanleybet
      - V_VIEWER_TROTTING8_INDEX_TITLE=PGVirtual V-Viewer Trotting8
      - V_VIEWER_TROTTING8_API_ENDPOINT="https://api.stanleybet-staging.pegma.group/api"
      # - V_VIEWER_TROTTING8_API_ENDPOINT=(function(){return document.location.protocol + "//" + document.location.hostname + ":9900/trotting8"}())
      - V_VIEWER_TROTTING8_JS_ENTRYPOINT=v-viewer-trotting8.min.js
      - V_VIEWER_TROTTING8_VARS=
        var v_param__show_partner_logo = 1, 
        v_param__full = 1,
        v_param__audio = 1,
        v_param__gui_layout_version = "v2",
        v_param__operator = "stanleybet",
        v_param__hide_channel = 0;
    working_dir:  /root/v-viewer
    volumes:
      - ../:/root/v-viewer:cached


      # - V_VIEWER_${GAME_ID}_PARTNER=pg/v2.0-blue
      #- V_VIEWER_${GAME_ID}_API_ENDPOINT=(function(){return document.location.protocol + "//" + document.location.hostname + ":9900/${game_id}"}())    
    # networks:
    #   - frontend

  v-viewer-browse:
    image: nginx:1.21.6-alpine
    volumes:
      - ../:/v-viewer:cached
      - ../misc/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../misc/nginx404.html:/usr/share/nginx/html/404.html
    
    ports:
      - '8090:80'

  v-viewer-fake-api:
    image:        node:18-alpine3.15
    command:      sh -c "yarn install && yarn start"
    environment:
      - NODE_ENV=development
    ports:
      - '9900:3000'
    working_dir:  /root/v-viewer-fake-api
    volumes:
      - ../packages/fake-api:/root/v-viewer-fake-api:cached